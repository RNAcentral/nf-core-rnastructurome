name: nf-core linting comment
# This workflow is triggered after the linting action is complete
# It posts an automated comment to the PR, even if the PR is coming from a fork

on:
  workflow_run:
    workflows: ["nf-core linting"]
    types: [completed]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download lint results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            --repo "${{ github.repository }}" \
            --name linting-logs \
            --dir linting-logs

      - name: Get PR number
        id: pr_number
        run: echo "pr_number=$(cat linting-logs/PR_number.txt)" >> $GITHUB_OUTPUT

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_number.outputs.pr_number }}
        run: |
          marker='<!-- nf-core-linting-comment -->'
          body_file=$(mktemp)
          {
            echo "$marker"
            cat linting-logs/lint_results.md
          } > "$body_file"

          existing_comment_id=$(
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- nf-core-linting-comment -->"))) | .id' \
              | tail -n 1
          )

          if [[ -n "${existing_comment_id}" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" \
              --method PATCH \
              --field body@"${body_file}" >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --field body@"${body_file}" >/dev/null
          fi
