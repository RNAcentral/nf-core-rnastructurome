name: merge_shannon_wig
description: Merge per-transcript Shannon entropy WIG files into a single combined WIG file
keywords:
  - wig
  - shannon
  - entropy
  - rnaframework
tools:
  - python:
      description: Python runtime used for WIG merging
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["Python-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing group metadata (e.g. sample_group, condition)
    - wig:
        type: file
        description: One or more per-transcript Shannon entropy WIG files
        pattern: "*.wig"
output:
  merged_wig:
    - - meta:
          type: map
          description: Groovy Map containing group metadata
      - "*.merged.wig":
          type: file
          description: Combined Shannon entropy WIG file
          pattern: "*.merged.wig"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
