name: rnaframework_rfeval
description: |
  Evaluates the agreement between rf-norm reactivity profiles and a set of
  known reference secondary structures using the Unpaired Coefficient, DSCI,
  and AUROC metrics. Run optionally to benchmark pipeline output against
  published or experimentally validated structures.
keywords:
  - rnaframework
  - structure
  - evaluation
  - benchmarking
  - reactivity
tools:
  - rnaframework:
      description: |
        RNAFramework is a toolkit for processing and analysing RNA structure probing data.
      homepage: https://rnaframework-docs.readthedocs.io/
      documentation: https://rnaframework-docs.readthedocs.io/en/latest/rf-eval/
      licence: ["GPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample/group information
          e.g. [ id:'group1' ]
    - xml:
        type: file
        description: |
          One or more rf-norm XML reactivity files (staged as xml_input*/).
        pattern: "*.xml"
        ontologies: []
  - structures:
      type: file
      description: |
        Reference secondary structure file(s) in Vienna/dotbracket format.
        Can be a single file containing multiple entries or a directory of
        per-transcript .db files. Transcript IDs must match those in the XML.
      pattern: "*.{db,txt}"
      ontologies: []
output:
  csv:
    - - meta:
          type: map
          description: Groovy Map containing sample/group information
      - "*.csv":
          type: file
          description: |
            Per-transcript evaluation metrics: Unpaired Coefficient, DSCI, and AUROC.
          pattern: "*.csv"
          ontologies: []
  plots:
    - - meta:
          type: map
          description: Groovy Map containing sample/group information
      - "plots/*.pdf":
          type: file
          description: |
            Optional metric plots — reactivity distributions, ROC curves, and
            score histograms (requires -g flag and R).
          pattern: "*.pdf"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample/group information
      - "rfeval.log":
          type: file
          description: rf-eval run log
          pattern: "rfeval.log"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
