name: tordat
description: Convert RNAFramework XML reactivity files and dot-bracket structures to RDAT format
keywords:
  - rdat
  - rnaframework
  - reactivity
  - secondary structure
tools:
  - python:
      description: Python runtime used to build RDAT files from XML and dot-bracket input
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["Python-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing group metadata (e.g. cell_line, condition)
    - xml:
        type: file
        description: RNAFramework XML reactivity files (one per replicate)
        pattern: "*.xml"
    - fold_dir:
        type: directory
        description: Directory of RNAFramework rf-fold output containing dot-bracket structures
  - tordat_script:
      type: file
      description: Python script that performs the XML-to-RDAT conversion
      pattern: "rnaframework_to_rdat.py"
output:
  rdat:
    - - meta:
          type: map
          description: Groovy Map containing group metadata
      - "${prefix}_rdat/*.rdat":
          type: file
          description: RDAT files with per-transcript reactivity and structure data (absent if no transcripts passed coverage filters)
          pattern: "*.rdat"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
