# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "CORRELATE_REPLICATES"
description: Assess replicate reproducibility by correlating per-sample_group reactivity XMLs with rf-correlate, emitting a correlation matrix and a MultiQC report.
keywords:
  - reproducibility
  - correlation
  - replicates
  - qc
  - rnastructurome
components:
  - rnaframework/rfcorrelate
input:
  - ch_fold_input:
      type: channel
      description: |
        Reactivity XMLs grouped by sample_group. Structure: [ val(meta), list(path(xml)) ]
output:
  - matrix:
      type: channel
      description: |
        Pairwise correlation matrix. Structure: [ val(meta), path(matrix.csv) ]
  - multiqc:
      type: channel
      description: |
        MultiQC report fragment. Structure: path(rfcorrelate_mqc.yaml)
  - versions:
      type: channel
      description: |
        Collected software version files. Structure: [ path(versions.yml) ]
authors:
  - "@vicbeg"
maintainers:
  - "@vicbeg"
